name: GitHub Profile Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: tiagodomo
          filename: github-metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          config_timezone: Europe/Lisbon
          config_display: large
          config_padding: 16, 24
          config_order: base.header, introduction, base.activity+community, base.repositories, languages, isocalendar, habits, base.metadata

          plugin_introduction: yes
          plugin_introduction_title: Software Development Student · Portugal 🇵🇹

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_analysis_timeout: 15

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
